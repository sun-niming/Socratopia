<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #b9e7f2;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .scene {
      width: 100vw;
      height: 100vh;
      min-height: 420px;
      position: relative;
      background: linear-gradient(#b9e7f2 0 68%, #8bd09e 68% 100%);
    }
    svg { width: 100%; height: 100%; display: block; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.2s linear infinite; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal 1.2s linear infinite; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: leg 1.2s ease-in-out infinite; }
    .leg.back { animation-delay: -.6s; }
    .wing { transform-box: fill-box; transform-origin: 70% 20%; animation: flap 1.2s ease-in-out infinite; }
    .body { animation: bob 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cloud { animation: drift 18s linear infinite; }
    .cloud.two { animation-duration: 24s; animation-delay: -9s; }
    .ground-line { animation: ground 2.4s linear infinite; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes leg { 0%,100% { transform: rotate(24deg); } 50% { transform: rotate(-22deg); } }
    @keyframes flap { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-13deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes drift { from { transform: translateX(-16vw); } to { transform: translateX(115vw); } }
    @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-180px); } }
  </style>
</head>
<body>
  <main class="scene" aria-label="鹈鹕骑自行车的二维动画">
    <svg viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着小帽子的鹈鹕在草地上骑着红色自行车，云朵缓慢飘过。</desc>
      <g class="cloud" fill="#fff" opacity=".88">
        <path d="M90 120c0-22 18-40 40-40 9 0 18 3 25 9 8-19 26-31 48-31 28 0 50 22 50 50h8c17 0 30 14 30 31H90c0-11 0-13 0-19z"/>
      </g>
      <g class="cloud two" fill="#fff" opacity=".7">
        <path d="M680 185c0-17 14-31 31-31 7 0 14 2 19 7 6-14 20-24 36-24 22 0 39 17 39 39h6c13 0 23 10 23 23H680z"/>
      </g>
      <path d="M0 410 Q170 385 340 410 T680 405 T1000 410 V600 H0Z" fill="#86cf98"/>
      <g class="ground-line" stroke="#4baf78" stroke-width="5" stroke-linecap="round" opacity=".7">

      </g>

          <path d="M413 145h48M230 132h39"/>
        </g>
        <g class="pedal" fill="none" stroke="#293b52" stroke-width="7">
          <circle cx="340" cy="330" r="24"/><path d="M340 330l32-22m-32 22-31 23"/><path d="M370 308h28m-57 45h-28" stroke-width="5"/>
        </g>
        <g class="body">
          <ellipse cx="338" cy="159" rx="112" ry="96" fill="#f5a43b" stroke="#293b52" stroke-width="7"/>

          <circle cx="463" cy="73" r="9" fill="#293b52"/>

          <path d="M452 35l-5-24m27 18 6-27m24 31 15-21" stroke="#3b82b8" stroke-width="7" stroke-linecap="round"/>
          <path d="M406 159c-12 31-21 57-19 79" fill="none" stroke="#293b52" stroke-width="7"/>
        </g>
        <g class="leg" stroke="#e8892d" stroke-width="13" stroke-linecap="round">
          <path d="M307 219l24 91"/>

        </g>
        <path d="M407 159c18 8 29 19 38 34" fill="none" stroke="#293b52" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g fill="#4baf78" opacity=".7">
        <path d="M100 530l8-25 8 25zm35 20 8-25 8 25zm760-9 8-27 8 27z"/>
      </g>
    </svg>
  </main>
</body>
</html>
